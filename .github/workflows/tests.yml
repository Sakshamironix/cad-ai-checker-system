name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: cad-ai-checker
          environment-file: environment.yml
          auto-activate-base: false
          use-mamba: true

      - name: Run tests
        shell: bash -l {0}
        run: pytest -q

      - name: Static compilation check
        shell: bash -l {0}
        run: python -m py_compile app/*.py scripts/healthcheck.py

      - name: Offline health check
        shell: bash -l {0}
        run: python scripts/healthcheck.py

      - name: Secret-pattern scan
        shell: bash
        run: "! git grep -nE 'AIza[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9]{20,}'"

      - name: Container build
        run: docker build --tag cad-ai-checker:${{ github.sha }} .
